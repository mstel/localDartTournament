name: CI and release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild for this Supabase project
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Analyze and test
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Release-Tag $env:GITHUB_REF_NAME stimmt nicht mit pubspec.yaml ($packageVersion) überein."
          }

  desktop-windows-x64:
    name: Desktop Windows 2022 x64
    if: github.event_name != 'workflow_dispatch' || inputs.release_tag != ''
    runs-on: windows-2022
    env:
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Verify manually selected release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+\+\d+$') {
            throw "Unsupported release tag: $env:RELEASE_TAG"
          }
          $packageVersion = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "Release tag $env:RELEASE_TAG does not match pubspec.yaml ($packageVersion)."
          }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Release $env:RELEASE_TAG does not exist."
          }

      - name: Build Windows x64
        run: flutter build windows --release --dart-define="SUPABASE_URL=https://pwqpcrzbmaxywcdotkbq.supabase.co" --dart-define="SUPABASE_PUBLISHABLE_KEY=$env:SUPABASE_PUBLISHABLE_KEY"

      - name: Package Windows update
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $releaseTag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+\+\d+$') {
            throw "Unsupported release tag: $releaseTag"
          }
          $tagVersion = $releaseTag.Substring(1)
          $version, $build = $tagVersion.Split('+')
          $bundle = 'build/windows/x64/runner/Release'
          New-Item -ItemType Directory -Force "$bundle/data" | Out-Null
          $manifest = [ordered]@{
            schemaVersion = 1
            version = $version
            build = [int]$build
            platform = 'windows'
            architecture = 'x64'
          }
          $manifest | ConvertTo-Json -Compress | Set-Content "$bundle/data/update-manifest.json" -Encoding utf8
          Compress-Archive -Path "$bundle/*" -DestinationPath 'dart-turnier-windows-x64.zip' -Force

      - name: Upload Windows update
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dart-turnier-windows-x64.zip
          if-no-files-found: error

  desktop-linux-x64:
    name: Desktop Linux Ubuntu 22.04 x64
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    env:
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux x64
        run: flutter build linux --release --dart-define="SUPABASE_URL=https://pwqpcrzbmaxywcdotkbq.supabase.co" --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify Linux x64 architecture
        run: file build/linux/x64/release/bundle/dart_tournament_manager | grep -Eq 'x86-64|x86_64'

      - name: Package Linux x64 update
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          version="${tag_version%%+*}"
          build="${tag_version##*+}"
          bundle="build/linux/x64/release/bundle"
          mkdir -p "$bundle/data"
          printf '{"schemaVersion":1,"version":"%s","build":%s,"platform":"linux","architecture":"x64"}\n' \
            "$version" "$build" > "$bundle/data/update-manifest.json"
          tar -czf dart-turnier-linux-x64.tar.gz -C "$bundle" .

      - name: Upload Linux x64 update
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dart-turnier-linux-x64.tar.gz
          if-no-files-found: error

  desktop-linux-arm64:
    name: Desktop Linux Ubuntu 22.04 ARM64
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04-arm
    env:
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Set up Flutter for ARM64
        run: |
          git clone --depth 1 --branch 3.44.4 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux ARM64
        run: flutter build linux --release --dart-define="SUPABASE_URL=https://pwqpcrzbmaxywcdotkbq.supabase.co" --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify Linux ARM64 architecture
        run: file build/linux/arm64/release/bundle/dart_tournament_manager | grep -Eq 'aarch64|ARM64'

      - name: Package Linux ARM64 update
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          version="${tag_version%%+*}"
          build="${tag_version##*+}"
          bundle="build/linux/arm64/release/bundle"
          mkdir -p "$bundle/data"
          printf '{"schemaVersion":1,"version":"%s","build":%s,"platform":"linux","architecture":"arm64"}\n' \
            "$version" "$build" > "$bundle/data/update-manifest.json"
          tar -czf dart-turnier-linux-arm64.tar.gz -C "$bundle" .

      - name: Upload Linux ARM64 update
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dart-turnier-linux-arm64.tar.gz
          if-no-files-found: error

  android-apk:
    name: Signed Android APK
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'

      - name: Verify release tag
        if: github.event_name != 'pull_request'
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "Unsupported Android release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          package_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r')"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Release tag $RELEASE_TAG does not match pubspec.yaml ($package_version)." >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.p12
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.p12
          EOF

      - name: Build signed Android APK
        run: flutter build apk --release --dart-define="SUPABASE_URL=https://pwqpcrzbmaxywcdotkbq.supabase.co" --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk dart-turnier-android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dart-turnier-android.apk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - desktop-windows-x64
      - desktop-linux-x64
      - desktop-linux-arm64
      - android-apk
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create SHA256SUMS
        run: |
          cd release-assets
          while IFS= read -r file; do
            sha256sum "$file" | awk -v name="$(basename "$file")" '{ print $1 "  " name }'
          done < <(find . -type f ! -name SHA256SUMS | sort) > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            release-assets/windows-x64/dart-turnier-windows-x64.zip
            release-assets/linux-x64/dart-turnier-linux-x64.tar.gz
            release-assets/linux-arm64/dart-turnier-linux-arm64.tar.gz
            release-assets/android-apk/dart-turnier-android.apk
            release-assets/SHA256SUMS

  attach-release-packages:
    name: Update Windows and Android assets on existing release
    if: github.event_name == 'workflow_dispatch'
    needs:
      - desktop-windows-x64
      - android-apk
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: windows-x64

      - name: Download signed Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: android-apk

      - name: Download current release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Update packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          cp android-apk/dart-turnier-android.apk release-assets/dart-turnier-android.apk
          cp windows-x64/dart-turnier-windows-x64.zip release-assets/dart-turnier-windows-x64.zip
          (
            cd release-assets
            find . -type f ! -name SHA256SUMS -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )
          gh release upload "$RELEASE_TAG" \
            release-assets/dart-turnier-android.apk \
            release-assets/dart-turnier-windows-x64.zip \
            release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
